  <script>
    let polySynthInstance = null;
    let synthInstance = null;

    function initToneSynth() {
      try {
        if (typeof Tone !== 'undefined') {
          if (!synthInstance) synthInstance = new Tone.Synth().toDestination();
          if (!polySynthInstance) polySynthInstance = new Tone.PolySynth().toDestination();
        }
      } catch (e) {}
    }

    window.playEffectSound = (type) => {
      try {
        if (typeof Tone !== 'undefined' && Tone.context && Tone.context.state !== 'running') {
          Tone.start();
        }
        initToneSynth();

        if (type === 'correct' && polySynthInstance) {
          polySynthInstance.triggerAttackRelease(["C5", "E5", "G5"], "8n");
        } else if (type === 'wrong' && synthInstance) {
          synthInstance.triggerAttackRelease("C3", "8n");
        } else if (type === 'attach' && synthInstance) {
          synthInstance.triggerAttackRelease("G4", "16n");
        } else if (type === 'whistle' && polySynthInstance) {
          polySynthInstance.triggerAttackRelease(["F5", "A5"], "4n");
        } else if (type === 'victory' && polySynthInstance) {
          polySynthInstance.triggerAttackRelease(["C4", "E4", "G4", "C5"], "4n");
        }
      } catch (e) {
        // Fallback Web Audio API
        try {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (!AudioCtx) return;
          const ctx = new AudioCtx();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain);
          gain.connect(ctx.destination);
          const now = ctx.currentTime;
          if (type === 'correct' || type === 'attach') {
            osc.frequency.setValueAtTime(523.25, now);
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
            osc.start(now);
            osc.stop(now + 0.2);
          } else if (type === 'wrong') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(180, now);
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
            osc.start(now);
            osc.stop(now + 0.25);
          }
        } catch (err) {}
      }
    };
  </script>

    /* =========================================================
       3. CUSTOM ENGINE: SYNONYM TRAIN GAME 🚂💨
       ========================================================= */
    function SynonymTrainGame({ studentName, studentAvatar, onBack, onFinish }) {
      const [currentLevelIdx, setCurrentLevelIdx] = useState(0);
      const [currentQuestionIdx, setCurrentQuestionIdx] = useState(0);
      const [score, setScore] = useState(0);
      const [selectedSynonyms, setSelectedSynonyms] = useState([]);
      const [shuffledOptions, setShuffledOptions] = useState([]);
      const [disabledWords, setDisabledWords] = useState([]);
      const [wrongShakingWord, setWrongShakingWord] = useState(null);

      const [showIntroModal, setShowIntroModal] = useState(true);
      const [showWinModal, setShowWinModal] = useState(false);
      const [isLeavingTrain, setIsLeavingTrain] = useState(false);

      const [errors, setErrors] = useState([]);
      const [startTime] = useState(Date.now());
      const [timeSpentSeconds, setTimeSpentSeconds] = useState(0);

      const currentLevel = SYNONYM_TRAIN_LEVELS[currentLevelIdx];
      const currentQuestion = currentLevel ? currentLevel.questions[currentQuestionIdx] : null;

      // Timer
      useEffect(() => {
        if (showWinModal) return;
        const timer = setInterval(() => {
          setTimeSpentSeconds(Math.floor((Date.now() - startTime) / 1000));
        }, 1000);
        return () => clearInterval(timer);
      }, [showWinModal, startTime]);

      // Shuffle options on question change
      useEffect(() => {
        if (!currentQuestion) return;
        setSelectedSynonyms([]);
        setDisabledWords([]);
        const opts = [...currentQuestion.correctSynonyms, ...currentQuestion.distractors];
        opts.sort(() => Math.random() - 0.5);
        setShuffledOptions(opts);
        setIsLeavingTrain(false);
      }, [currentLevelIdx, currentQuestionIdx]);

      const handleStartLevel = () => {
        setShowIntroModal(false);
      };

      const handleWordPick = (word) => {
        if (!currentQuestion || disabledWords.includes(word)) return;

        const isCorrect = currentQuestion.correctSynonyms.includes(word);

        if (isCorrect) {
          window.playEffectSound('attach');
          const updated = [...selectedSynonyms, word];
          setSelectedSynonyms(updated);
          setDisabledWords((prev) => [...prev, word]);

          // Check if all synonyms for this word found
          if (updated.length === currentQuestion.correctSynonyms.length) {
            window.playEffectSound('correct');
            const levelPoints = 10 * currentLevel.levelNum;
            setScore((s) => s + levelPoints);

            setTimeout(() => {
              advanceToNextQuestion();
            }, 1000);
          }
        } else {
          window.playEffectSound('wrong');
          setWrongShakingWord(word);
          setTimeout(() => setWrongShakingWord(null), 500);

          setErrors((prev) => [
            ...prev,
            {
              question: `Потяг "${currentQuestion.targetWord}" (${currentQuestion.partOfSpeech})`,
              userAnswer: word,
              correctAnswer: currentQuestion.correctSynonyms.join(', ')
            }
          ]);
        }
      };

      const advanceToNextQuestion = () => {
        window.playEffectSound('whistle');
        setIsLeavingTrain(true);

        setTimeout(() => {
          if (currentQuestionIdx + 1 < currentLevel.questions.length) {
            setCurrentQuestionIdx((i) => i + 1);
          } else {
            // Level completed
            if (currentLevelIdx + 1 < SYNONYM_TRAIN_LEVELS.length) {
              setCurrentLevelIdx((l) => l + 1);
              setCurrentQuestionIdx(0);
              setShowIntroModal(true);
            } else {
              // Game Victory
              finishGame();
            }
          }
        }, 1100);
      };

      const finishGame = () => {
        setShowWinModal(true);
        window.playEffectSound('victory');
        if (typeof confetti === 'function') {
          confetti({ particleCount: 120, spread: 80, origin: { y: 0.6 } });
        }

        const totalTimeStr = `${Math.floor(timeSpentSeconds / 60)} хв ${timeSpentSeconds % 60} сек`;
        const maxScore = 180; // 30 + 60 + 90
        const accuracy = Math.min(100, Math.round((score / maxScore) * 100));

        onFinish({
          studentName,
          gameId: 'synonym-train',
          gameTitle: 'Синонімічний Потяг 🚂💨',
          score,
          maxScore,
          accuracy,
          timeTaken: totalTimeStr,
          errors
        });
      };

      return (
        <div className="max-w-4xl mx-auto space-y-6 relative animate-fadeIn">
          {/* Animated clouds in background */}
          <div className="cloud cloud1"></div>
          <div className="cloud cloud2"></div>

          {/* Top Control Bar */}
          <div className="bg-white/90 backdrop-blur rounded-2xl p-4 shadow-md flex items-center justify-between border-2 border-yellow-300 relative z-20">
            <button
              onClick={onBack}
              className="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-xl text-sm flex items-center gap-2"
            >
              <i className="fa-solid fa-arrow-left"></i> До меню
            </button>

            <div className="flex items-center gap-2 sm:gap-3">
              <span className="bg-amber-400 text-amber-950 font-black px-3 py-1.5 rounded-xl text-xs sm:text-sm shadow-sm border border-amber-500">
                Рівень {currentLevel?.levelNum || 1}
              </span>
              <span className="bg-emerald-500 text-white font-black px-3 py-1.5 rounded-xl text-xs sm:text-sm shadow-sm">
                ⭐ {score} балів
              </span>
            </div>

            <div className="flex items-center gap-2">
              <span className="text-xl">{studentAvatar}</span>
              <span className="font-bold text-slate-700 text-sm hidden sm:inline">{studentName}</span>
            </div>
          </div>

          {/* Main Game Screen */}
          <div className="bg-gradient-to-b from-sky-200 via-sky-100 to-emerald-100 rounded-3xl p-6 shadow-xl border-4 border-yellow-300 relative overflow-hidden z-10 min-h-[480px] flex flex-col justify-between">
            
            {/* Instruction Banner */}
            <div className="bg-white/90 border-2 border-sky-400 rounded-2xl p-3 text-center shadow-md max-w-xl mx-auto">
              <p className="text-sm sm:text-base font-bold text-slate-800">
                Знайди <span className="text-rose-600 font-black underline">{currentLevel?.targetCount}</span> синоніми(в) до слова{' '}
                <span className="text-indigo-700 font-black uppercase underline decoration-yellow-400 decoration-4">
                  {currentQuestion?.targetWord}
                </span>!
              </p>
            </div>

            {/* Train Track & Train Rendering */}
            <div className="w-full my-6 relative py-4 flex flex-col items-center">
              <div
                className={`w-full flex items-end justify-center space-x-2 sm:space-x-3 px-2 min-h-[160px] ${
                  isLeavingTrain ? 'train-leave' : 'train-enter'
                }`}
              >
                {/* Engine */}
                <div className="relative flex flex-col items-center flex-shrink-0">
                  <div className="smoke" style={{ top: '-18px', left: '18px', width: '22px', height: '22px' }}></div>
                  <div className="smoke" style={{ top: '-32px', left: '8px', width: '30px', height: '30px', animationDelay: '0.4s' }}></div>

                  <div className="bg-gradient-to-b from-rose-500 to-rose-700 text-white p-3 sm:p-4 rounded-t-3xl rounded-b-xl border-4 border-rose-800 shadow-xl flex flex-col items-center min-w-[110px] sm:min-w-[140px] relative z-10">
                    <span className="text-[10px] sm:text-xs font-bold uppercase bg-rose-950/40 px-2 py-0.5 rounded-full mb-1">
                      {currentQuestion?.partOfSpeech}
                    </span>
                    <span className="text-lg sm:text-2xl font-black text-yellow-300 drop-shadow-md tracking-wide">
                      {currentQuestion?.targetWord}
                    </span>
                    <div className="absolute -top-4 right-3 w-4 h-5 bg-slate-800 rounded-t"></div>
                  </div>

                  <div className="flex justify-between w-full px-2 -mt-3 z-20">
                    <div className="w-8 h-8 bg-slate-900 border-4 border-slate-300 rounded-full flex items-center justify-center wheel-spin">
                      <div className="w-2 h-2 bg-yellow-400 rounded-full"></div>
                    </div>
                    <div className="w-8 h-8 bg-slate-900 border-4 border-slate-300 rounded-full flex items-center justify-center wheel-spin">
                      <div className="w-2 h-2 bg-yellow-400 rounded-full"></div>
                    </div>
                  </div>
                </div>

                {/* Wagons Slots */}
                {Array.from({ length: currentLevel?.targetCount || 2 }).map((_, idx) => {
                  const filledWord = selectedSynonyms[idx];
                  return filledWord ? (
                    <div key={idx} className="relative flex flex-col items-center flex-shrink-0 bounce-correct">
                      <div className="bg-gradient-to-b from-indigo-500 to-indigo-700 text-white p-3 sm:p-4 rounded-t-2xl rounded-b-xl border-4 border-indigo-900 shadow-lg flex items-center justify-center min-w-[95px] sm:min-w-[125px] h-[75px] sm:h-[90px] relative">
                        <span className="text-base sm:text-xl font-bold text-yellow-200">{filledWord}</span>
                      </div>
                      <div className="flex justify-between w-full px-2 -mt-3 z-20">
                        <div className="w-7 h-7 bg-slate-800 border-2 border-slate-300 rounded-full flex items-center justify-center wheel-spin"></div>
                        <div className="w-7 h-7 bg-slate-800 border-2 border-slate-300 rounded-full flex items-center justify-center wheel-spin"></div>
                      </div>
                    </div>
                  ) : (

    /* =========================================================
       4. STANDARD GAME ENGINE (For other games)
       ========================================================= */
    function GameEngine({ game, studentName, studentAvatar, onBack, onFinish }) {
      const [currentIndex, setCurrentIndex] = useState(0);
      const [score, setScore] = useState(0);
      const [selectedOption, setSelectedOption] = useState(null);
      const [isAnswered, setIsAnswered] = useState(false);
      const [errors, setErrors] = useState([]);
      const [isCompleted, setIsCompleted] = useState(false);
      const [startTime] = useState(Date.now());
      const [timeSpentSeconds, setTimeSpentSeconds] = useState(0);

      const currentQ = game.questions[currentIndex];

      useEffect(() => {
        if (isCompleted) return;
        const timer = setInterval(() => {
          setTimeSpentSeconds(Math.floor((Date.now() - startTime) / 1000));
        }, 1000);
        return () => clearInterval(timer);
      }, [isCompleted, startTime]);

      const handleOptionClick = (opt) => {
        if (isAnswered) return;

        setSelectedOption(opt);
        setIsAnswered(true);

        const isCorrect = opt === currentQ.answer;

        if (isCorrect) {
          setScore((s) => s + 1);
          window.playEffectSound('correct');
        } else {
          window.playEffectSound('wrong');
          setErrors((prev) => [
            ...prev,
            {
              question: currentQ.q,
              userAnswer: opt,
              correctAnswer: currentQ.answer
            }
          ]);
        }

        setTimeout(() => {
          if (currentIndex + 1 < game.questions.length) {
            setCurrentIndex((i) => i + 1);
            setSelectedOption(null);
            setIsAnswered(false);
          } else {
            finishGame(score + (isCorrect ? 1 : 0));
          }
        }, 1200);
      };

      const finishGame = (finalScore) => {
        setIsCompleted(true);
        window.playEffectSound('victory');
        if (typeof confetti === 'function') {
          confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
        }

        const totalTimeStr = `${Math.floor(timeSpentSeconds / 60)} хв ${timeSpentSeconds % 60} сек`;
        const accuracy = Math.round((finalScore / game.questions.length) * 100);

        onFinish({
          studentName,
          gameId: game.id,
          gameTitle: game.title,
          score: finalScore,
          maxScore: game.questions.length,
          accuracy,
          timeTaken: totalTimeStr,
          errors
        });
      };

      return (
        <div className="max-w-2xl mx-auto space-y-6 animate-fadeIn">
          <div className="bg-white rounded-2xl p-4 shadow-md flex items-center justify-between border-2 border-slate-100">
            <button
              onClick={onBack}
              className="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-xl text-sm flex items-center gap-2"
            >
              <i className="fa-solid fa-arrow-left"></i> Назад
            </button>

            <div className="font-kids font-bold text-slate-800 text-base sm:text-lg">
              {game.title}
            </div>

            <div className="flex items-center gap-2">
              <span className="text-xl">{studentAvatar}</span>
              <span className="font-bold text-slate-700 text-sm hidden sm:inline">{studentName}</span>
            </div>
          </div>

          {!isCompleted ? (
            <div className="bg-white rounded-3xl p-6 sm:p-8 card-shadow border-4 border-yellow-200 relative overflow-hidden">
              <div className="flex items-center justify-between text-xs font-bold text-slate-500 mb-3">
                <span>Питання {currentIndex + 1} з {game.questions.length}</span>
                <span className="flex items-center gap-1 text-indigo-600">
                  <i className="fa-solid fa-stopwatch"></i> {timeSpentSeconds} сек
                </span>
              </div>

              <div className="w-full bg-slate-100 h-3 rounded-full overflow-hidden mb-8 border border-slate-200">
                <div
                  className="bg-gradient-to-r from-amber-400 to-emerald-500 h-full transition-all duration-300"
                  style={{ width: `${((currentIndex + 1) / game.questions.length) * 100}%` }}
                ></div>
              </div>

              <div className="bg-amber-50/90 rounded-2xl p-6 text-center border-2 border-amber-200 mb-8 min-h-[100px] flex items-center justify-center">
                <h3 className="font-kids text-2xl sm:text-3xl font-bold text-slate-900 leading-snug">
                  {currentQ.q}
                </h3>
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                {currentQ.options.map((option, idx) => {
                  let btnStyle = 'bg-slate-50 border-2 border-slate-200 text-slate-800 hover:bg-amber-100 hover:border-amber-400';
                  if (isAnswered) {
                    if (option === currentQ.answer) {
                      btnStyle = 'bg-emerald-500 border-2 border-emerald-600 text-white shadow-lg scale-102';
                    } else if (option === selectedOption) {
                      btnStyle = 'bg-rose-500 border-2 border-rose-600 text-white';
                    } else {
                      btnStyle = 'bg-slate-100 text-slate-400 border-2 border-slate-200 opacity-50';
                    }
                  }

                  return (
                    <button
                      key={idx}
                      disabled={isAnswered}
                      onClick={() => handleOptionClick(option)}
                      className={`py-4 px-6 rounded-2xl font-kids text-xl font-bold transition-all text-center flex items-center justify-center shadow-sm ${btnStyle}`}
                    >
                      {option}
                    </button>
                  );
                })}
              </div>
            </div>
          ) : (
            <div className="bg-white rounded-3xl p-8 card-shadow border-4 border-yellow-300 text-center space-y-6 animate-scaleUp">
              <div className="text-6xl animate-bounce">🏆</div>

              <div>
                <h3 className="font-kids text-3xl font-bold text-slate-900 mb-2">
                  Чудова робота, {studentName}!
                </h3>
                <p className="text-slate-600 font-semibold">
                  Ти успішно завершив(ла) гру <span className="text-indigo-600 font-bold">{game.title}</span>!
                </p>
              </div>

              <div className="bg-gradient-to-r from-amber-50 to-orange-50 rounded-2xl p-6 border-2 border-amber-200 grid grid-cols-3 gap-4">
                <div>
                  <div className="text-3xl font-black text-amber-500">{score} / {game.questions.length}</div>
                  <div className="text-[11px] font-bold text-slate-500 uppercase tracking-wider mt-1">Правильно</div>
                </div>
                <div>
                  <div className="text-3xl font-black text-indigo-600">{Math.round((score / game.questions.length) * 100)}%</div>
                  <div className="text-[11px] font-bold text-slate-500 uppercase tracking-wider mt-1">Точність</div>
                </div>
                <div>
                  <div className="text-3xl font-black text-emerald-600">{timeSpentSeconds}с</div>
                  <div className="text-[11px] font-bold text-slate-500 uppercase tracking-wider mt-1">Час</div>
                </div>
              </div>

              <button
                onClick={onBack}
                className="w-full py-4 bg-gradient-to-r from-emerald-500 to-teal-600 text-white font-black text-lg rounded-2xl shadow-lg hover:shadow-xl transition-all"
              >
                Повернутися до каталогу ігор 🚀
              </button>
            </div>
          )}
        </div>
      );
    }

    /* =========================================================

       ========================================================= */
    function GameRequestForm({ onSaveIdea, savedGameIdeas, onDeleteIdea, onShowToast }) {
      const [category, setCategory] = useState('Українська мова');
      const [gameTitle, setGameTitle] = useState('');
      const [description, setDescription] = useState('');
      const [mediaUrl, setMediaUrl] = useState(null);
      const [mediaType, setMediaType] = useState('image');
      const [mediaName, setMediaName] = useState('');

      const handleFileUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;

        setMediaName(file.name);
        const isPdf = file.type === 'application/pdf' || file.name.endsWith('.pdf');
        setMediaType(isPdf ? 'pdf' : 'image');

        const reader = new FileReader();
        reader.onload = (uploadEvent) => {
          setMediaUrl(uploadEvent.target.result);
        };
        reader.readAsDataURL(file);
      };

      const copyToClipboard = (text) => {
        const textarea = document.createElement('textarea');
        textarea.value = text;
        document.body.appendChild(textarea);
        textarea.select();
        try {
          document.execCommand('copy');
          onShowToast('Скопійовано! Вставте цей текст у чат із Джемом 🚀');
        } catch (err) {
          onShowToast('Будь ласка, скопіюйте текст вручну з поля нижче.');
        }
        document.body.removeChild(textarea);
      };

      const handleCopyPrompt = () => {
        if (!description.trim()) {
          alert('Будь ласка, опишіть хоча б декілька слів про зміст гри!');
          return;
        }

        const formattedPrompt = `Привіт, Джем! Будь ласка, створи нову навчальну гру для учнів 2 класу НУШ для нашого порталу "Країна Знань".
        
📌 ПРЕДМЕТ/КАТЕГОРІЯ: ${category}
🎯 НАЗВА/ТЕМА: ${gameTitle || 'За темою уроку'}
📝 ЗМІСТ ТА ЗАВДАННЯ ГРИ:
${description.trim()}
${mediaName ? `\n🖼️ Додано файл з наочними матеріалами: ${mediaName}` : ''}`;

        copyToClipboard(formattedPrompt);
      };

      const handleSaveIdeaSubmit = (e) => {
        e.preventDefault();
        if (!description.trim()) {
          alert('Будь ласка, напишіть опис гри перед збереженням!');
          return;
        }

        const newIdea = {
          id: 'idea-' + Date.now(),
          category,
          title: gameTitle.trim() || 'Без назви',
          description: description.trim(),
          mediaUrl,
          mediaType,
          mediaName,
          timestamp: Date.now()
        };

        onSaveIdea(newIdea);
        setDescription('');
        setGameTitle('');
        setMediaUrl(null);
        setMediaName('');
      };

      return (
        <div className="space-y-8 animate-fadeIn">
          <div className="bg-white rounded-3xl p-6 sm:p-8 card-shadow border-2 border-indigo-100 space-y-6">
            <div className="border-b border-slate-100 pb-4">
              <h3 className="font-kids text-2xl font-bold text-indigo-950 flex items-center gap-2">
                <span>🪄</span> Опис та Замовлення Нової Гри
              </h3>
              <p className="text-xs text-slate-500 font-semibold mt-1">
                Опишіть у довільній формі, що саме ви хочете бачити в грі, і я (Джем) одразу створю її для вашого класу!
              </p>
            </div>

            <form onSubmit={handleSaveIdeaSubmit} className="space-y-5">
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                  <label className="block text-xs font-bold text-slate-600 mb-1.5 uppercase tracking-wider">
                    Предмет / Категорія:
                  </label>
                  <select
                    value={category}
                    onChange={(e) => setCategory(e.target.value)}
                    className="w-full px-4 py-3 rounded-2xl border-2 border-slate-200 text-sm font-bold text-slate-800 focus:outline-none focus:border-indigo-500"
                  >
                    <option value="Математика">Математика 🚂</option>
                    <option value="Українська мова">Українська мова 📚</option>
                    <option value="Логіка">Логіка 🧩</option>
                    <option value="Я досліджую світ">Я досліджую світ 🌿</option>
                    <option value="Інше">Інше / Комбіноване 🎨</option>
                  </select>
                </div>

                <div>
                  <label className="block text-xs font-bold text-slate-600 mb-1.5 uppercase tracking-wider">
                    Назва або тема гри (необов'язково):
                  </label>
                  <input
                    type="text"
                    placeholder="Наприклад: Влучні іменники, Таблиця множення на 3..."
                    value={gameTitle}
                    onChange={(e) => setGameTitle(e.target.value)}
                    className="w-full px-4 py-3 rounded-2xl border-2 border-slate-200 text-sm font-bold text-slate-900 focus:outline-none focus:border-indigo-500"
                  />
                </div>
              </div>

              <div>
                <label className="block text-xs font-bold text-indigo-900 mb-1.5 uppercase tracking-wider">
                  Опишіть зміст гри, тему або що ви хочете в ній бачити:
                </label>
                <textarea
                  required
                  rows="5"
                  placeholder="Наприклад: Зроби гру про іменники для 2 класу. Сюжет: допоможи білочці зібрати горішки..."
                  value={description}
                  onChange={(e) => setDescription(e.target.value)}
                  className="w-full px-4 py-3.5 rounded-2xl border-2 border-indigo-200 text-sm font-medium text-slate-900 focus:outline-none focus:border-indigo-600 shadow-inner leading-relaxed"
                />
              </div>

              <div className="bg-amber-50/70 p-4 rounded-2xl border-2 border-dashed border-amber-300 space-y-3">
                <label className="block text-xs font-bold text-amber-900 uppercase tracking-wider">
                  🖼️ Завантажити малюнок, картку чи PDF з прикладом/матеріалами:
                </label>
                <input
                  type="file"
                  accept="image/*,.pdf"
                  onChange={handleFileUpload}
                  className="block w-full text-xs text-slate-500 file:mr-4 file:py-2.5 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-amber-200 file:text-amber-900 hover:file:bg-amber-300 transition-all cursor-pointer"
                />

                {mediaUrl && (
                  <div className="bg-white p-3 rounded-xl border border-amber-300 flex items-center justify-between">
                    <div className="flex items-center gap-3">
                      {mediaType === 'pdf' ? (
                        <i className="fa-solid fa-file-pdf text-2xl text-rose-500"></i>
                      ) : (
                        <img src={mediaUrl} alt="Preview" className="w-12 h-12 object-cover rounded-lg border" />
                      )}
                      <span className="text-xs font-bold text-slate-700 truncate max-w-[200px]">
                        {mediaName || 'Завантажений файл'}
                      </span>
                    </div>
                    <button
                      type="button"
                      onClick={() => { setMediaUrl(null); setMediaName(''); }}
                      className="text-xs text-rose-500 font-bold hover:underline"
                    >
                      Видалити
                    </button>
                  </div>
                )}
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 pt-2">
                <button
                  type="button"
                  onClick={handleCopyPrompt}
                  className="py-4 bg-gradient-to-r from-amber-400 to-yellow-500 hover:from-amber-500 hover:to-yellow-600 text-slate-900 font-black rounded-2xl shadow-lg hover:shadow-xl transition-all text-base flex items-center justify-center gap-2"
                >
                  <i className="fa-solid fa-copy text-lg"></i>
                  <span>📋 Скопіювати опис для Джема</span>
                </button>

                <button
                  type="submit"
                  className="py-4 bg-indigo-600 hover:bg-indigo-700 text-white font-black rounded-2xl shadow-lg hover:shadow-xl transition-all text-base flex items-center justify-center gap-2"
                >
                  <i className="fa-solid fa-floppy-disk text-lg"></i>
                  <span>💾 Зберегти ідею на порталі</span>
                </button>
              </div>
            </form>
          </div>

          <div className="bg-white rounded-3xl p-6 sm:p-8 card-shadow border border-slate-100 space-y-4">
            <h4 className="font-kids text-xl font-bold text-slate-900 flex items-center gap-2">
              <span>💡</span> Мої замовлення та ідеї ігор ({savedGameIdeas.length})
            </h4>

            {savedGameIdeas.length === 0 ? (
              <div className="text-center py-8 text-slate-400 font-semibold text-sm">
                Ви ще не зберегли жодної ідеї. Напишіть опис гри вище та натисніть «Зберегти ідею»!
              </div>
            ) : (
              <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                {savedGameIdeas.map((idea) => (
                  <div key={idea.id} className="bg-slate-50 p-5 rounded-2xl border border-slate-200 flex flex-col justify-between space-y-3 hover:border-indigo-300 transition-colors">
                    <div>
                      <div className="flex items-center justify-between mb-2">
                        <span className="text-[11px] font-black text-indigo-700 bg-indigo-100 px-2.5 py-0.5 rounded-full uppercase">
                          {idea.category}
                        </span>
                        <span className="text-[10px] text-slate-400 font-bold">
                          {new Date(idea.timestamp).toLocaleDateString('uk-UA')}
                        </span>
                      </div>

                      <h5 className="font-kids font-bold text-slate-900 text-base mb-1">
                        {idea.title}
                      </h5>

                      <p className="text-xs text-slate-600 font-medium whitespace-pre-wrap leading-relaxed line-clamp-4">
                        {idea.description}
                      </p>

                      {idea.mediaName && (
                        <div className="mt-2 text-[11px] font-bold text-amber-800 flex items-center gap-1.5 bg-amber-100/70 p-1.5 rounded-lg">
                          <i className="fa-solid fa-paperclip"></i>
                          <span className="truncate">{idea.mediaName}</span>
                        </div>
                      )}
                    </div>

                    <div className="flex items-center justify-between pt-2 border-t border-slate-200/60">
                      <button
                        onClick={() => {
                          const text = `Запит для Джема:\nПредмет: ${idea.category}\nТема: ${idea.title}\nОпис: ${idea.description}`;
                          copyToClipboard(text);
                        }}
                        className="text-xs font-bold text-indigo-600 hover:text-indigo-800 flex items-center gap-1"
                      >
                        <i className="fa-solid fa-copy"></i> Скопіювати знову
                      </button>

                      <button
                        onClick={() => onDeleteIdea(idea.id)}
                        className="text-xs font-bold text-rose-500 hover:text-rose-700 p-1"
                        title="Видалити ідею"
                      >
                        🗑️ Видалити
                      </button>
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>
        </div>
      );
    }

    /* =========================================================
       7. ERROR DETAILS MODAL
       ========================================================= */
    function ErrorDetailsModal({ result, onClose }) {
      return (
        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
          <div className="bg-white rounded-3xl p-6 max-w-lg w-full card-shadow border-4 border-rose-200 space-y-5 animate-scaleUp max-h-[85vh] overflow-y-auto">
            <div className="flex items-center justify-between border-b border-slate-100 pb-3">
              <div>
                <h3 className="font-kids text-xl font-bold text-slate-900">
                  Детальний аналіз помилок
                </h3>
                <p className="text-xs text-slate-500 font-semibold">
                  Учень: <span className="text-indigo-600 font-bold">{result.studentName}</span> • Гра: {result.gameTitle}
                </p>
              </div>
              <button
                onClick={onClose}
                className="w-8 h-8 bg-slate-100 hover:bg-slate-200 rounded-full flex items-center justify-center text-slate-500 font-bold"
              >
                ✕
              </button>
            </div>

            <div className="space-y-4">
              {result.errors && result.errors.length > 0 ? (
                result.errors.map((err, idx) => (
                  <div key={idx} className="bg-rose-50/70 p-4 rounded-2xl border border-rose-200 space-y-2">
                    <div className="text-xs font-bold text-slate-500">Завдання №{idx + 1}:</div>
                    <div className="font-kids font-bold text-slate-900 text-base">{err.question}</div>
                    
                    <div className="grid grid-cols-2 gap-2 text-xs pt-1">
                      <div className="bg-white p-2.5 rounded-xl border border-rose-200 text-rose-700 font-bold">
                        ❌ Відповідь учня: <span className="underline">{err.userAnswer}</span>
                      </div>
                      <div className="bg-white p-2.5 rounded-xl border border-emerald-200 text-emerald-700 font-bold">
                        ✅ Правильно: <span>{err.correctAnswer}</span>
                      </div>
                    </div>
                  </div>
                ))
              ) : (
                <div className="text-center py-6 text-slate-500 font-semibold">
                  Учень не припустився жодної помилки! 🎉
                </div>
              )}
            </div>

            <button
              onClick={onClose}
              className="w-full py-3 bg-slate-900 hover:bg-slate-800 text-white font-bold rounded-2xl text-sm transition-all"
            >
              Закрити
            </button>
          </div>
        </div>
      );
    }

    /* =========================================================
       8. CONFIRM CLEAR MODAL
       ========================================================= */
    function ConfirmClearModal({ onConfirm, onCancel }) {
      return (
        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
          <div className="bg-white rounded-3xl p-6 max-w-sm w-full card-shadow border-4 border-rose-300 text-center space-y-5 animate-scaleUp">
            <div className="w-16 h-16 bg-rose-100 text-rose-600 rounded-2xl flex items-center justify-center text-3xl mx-auto">
              ⚠️
            </div>
            <div>
              <h3 className="font-kids text-xl font-bold text-slate-900">Очистити всю історію?</h3>
              <p className="text-xs text-slate-500 font-semibold mt-1">
                Всі результати та оцінки учнів будуть безповоротно видалені.
              </p>
            </div>
            <div className="grid grid-cols-2 gap-3 pt-2">
              <button
                onClick={onCancel}
                className="py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-xl text-xs"
              >
                Скасувати
              </button>
              <button
                onClick={onConfirm}
                className="py-2.5 bg-rose-600 hover:bg-rose-700 text-white font-bold rounded-xl text-xs shadow-md"
              >
                Видалити всі
              </button>
            </div>
          </div>
        </div>
      );
    }

    // Render Portal
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
